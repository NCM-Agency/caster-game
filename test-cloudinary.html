<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudinary Upload Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #d4af37;
        }
        h1 {
            text-align: center;
            color: #d4af37;
        }
        .upload-section {
            background: #2a2a4e;
            padding: 30px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid #8b4a9c;
        }
        input[type="file"] {
            display: block;
            margin: 20px 0;
            padding: 10px;
            background: #1a1a2e;
            border: 1px solid #d4af37;
            color: #d4af37;
            border-radius: 5px;
            width: 100%;
        }
        button {
            background: #d4af37;
            color: #1a1a2e;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #b8941f;
            transform: translateY(-2px);
        }
        #status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        #status.success {
            background: #2ecc71;
            color: white;
            display: block;
        }
        #status.error {
            background: #e74c3c;
            color: white;
            display: block;
        }
        #status.loading {
            background: #3498db;
            color: white;
            display: block;
        }
        .uploaded-images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .uploaded-image {
            background: #1a1a2e;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #8b4a9c;
        }
        .uploaded-image img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }
        .uploaded-image p {
            margin: 10px 0 0;
            font-size: 12px;
            color: #d4af37;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h1>🎨 Cloudinary Upload Test</h1>
    
    <div class="upload-section">
        <h2>Test Direct Upload (Client-Side)</h2>
        <p>This uploads directly to Cloudinary using the unsigned preset.</p>
        <input type="file" id="directFile" accept="image/*" multiple>
        <button onclick="testDirectUpload()">Upload Directly to Cloudinary</button>
    </div>

    <div class="upload-section">
        <h2>Test Netlify Function Upload</h2>
        <p>This uploads via our secure Netlify Function.</p>
        <input type="file" id="netlifyFile" accept="image/*">
        <button onclick="testNetlifyUpload()">Upload via Netlify Function</button>
    </div>

    <div class="upload-section">
        <h2>Test Media Library</h2>
        <button onclick="loadMediaLibrary()">Load All Images from Cloudinary</button>
    </div>

    <div id="status"></div>

    <div id="uploadedImages" class="uploaded-images"></div>

    <script>
        const CLOUD_NAME = 'dztstxsnd';
        const UPLOAD_PRESET = 'caster-unsigned';

        // Test direct upload to Cloudinary
        async function testDirectUpload() {
            const fileInput = document.getElementById('directFile');
            const files = fileInput.files;
            
            if (!files.length) {
                showStatus('Please select files to upload', 'error');
                return;
            }

            showStatus('Uploading directly to Cloudinary...', 'loading');

            try {
                const uploadPromises = Array.from(files).map(async (file) => {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', UPLOAD_PRESET);
                    formData.append('folder', 'caster-website/test');

                    const response = await fetch(
                        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
                        {
                            method: 'POST',
                            body: formData
                        }
                    );

                    if (!response.ok) {
                        throw new Error(`Upload failed for ${file.name}`);
                    }

                    return await response.json();
                });

                const results = await Promise.all(uploadPromises);
                
                showStatus(`✅ Successfully uploaded ${results.length} image(s)!`, 'success');
                displayImages(results);
                
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }

        // Test upload via Netlify Function
        async function testNetlifyUpload() {
            const fileInput = document.getElementById('netlifyFile');
            const file = fileInput.files[0];
            
            if (!file) {
                showStatus('Please select a file to upload', 'error');
                return;
            }

            showStatus('Uploading via Netlify Function...', 'loading');

            try {
                // Convert file to base64
                const base64 = await fileToBase64(file);
                
                // Call Netlify function
                const response = await fetch('/.netlify/functions/cloudinary-upload', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        image: base64,
                        filename: file.name,
                        folder: 'test'
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.details || 'Upload failed');
                }

                const result = await response.json();
                
                showStatus('✅ Successfully uploaded via Netlify Function!', 'success');
                displayImages([result]);
                
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }

        // Load media library
        async function loadMediaLibrary() {
            showStatus('Loading media library...', 'loading');
            
            try {
                const response = await fetch('/.netlify/functions/cloudinary-list');
                
                if (!response.ok) {
                    throw new Error('Failed to load media library');
                }
                
                const data = await response.json();
                
                if (data.assets && data.assets.length > 0) {
                    showStatus(`✅ Loaded ${data.assets.length} images from library`, 'success');
                    displayImages(data.assets);
                } else {
                    showStatus('Media library is empty', 'error');
                }
                
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }

        // Helper functions
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = type;
        }

        function displayImages(images) {
            const container = document.getElementById('uploadedImages');
            
            images.forEach(img => {
                const div = document.createElement('div');
                div.className = 'uploaded-image';
                
                const imgUrl = img.url || img.src || img.secure_url;
                const imgName = img.name || img.public_id || 'Uploaded Image';
                
                div.innerHTML = `
                    <img src="${imgUrl}" alt="${imgName}">
                    <p>${imgName}</p>
                `;
                
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
